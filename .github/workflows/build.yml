name: build docker

on:
  push:
    branches:
      - master
      - develop

jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push develop
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/develop'
        with:
          context: .
          file: ./Dockerfile
          #platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          #platforms: linux/amd64,linux/arm64,linux/arm/v7
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:develop
      -
        name: Build and push
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/master'
        with:
          context: .
          file: ./Dockerfile
          #platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:3
            ghcr.io/${{ github.repository }}:3.16
            ghcr.io/${{ github.repository }}:latest
      - name: Push image
        uses: akhilerm/tag-push-action@v2.3.0
        if: github.ref == 'refs/heads/master'
        with:
          src: ghcr.io/${{ github.repository }}:latest
          dst: |
            docker.io/bwdutton/gallery3:3
            docker.io/bwdutton/gallery3:3.1.6
            docker.io/bwdutton/gallery3:latest
